<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction</title>
    <!-- Bootstrap CSS Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
        }
        .prediction-card {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn-predict {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="prediction-card">
        <!-- Title & Subtitle -->
        <h2 class="text-center text-primary mb-3">Diabetes Prediction System</h2>
        <p class="text-center text-muted mb-4">Enter your health details below</p>

        <!-- Form Starts Here -->
        <form action="/predict_diabetes" method="post">
            <!-- Pregnancies Input -->
<div class="mb-3">
    <label class="form-label font-weight-bold">Pregnancies</label>
    <input type="number" step="any" name="pregnancies" class="form-control" placeholder="e.g. 2" required>
</div>

<!-- Blood Pressure Input -->
<div class="mb-3">
    <label class="form-label font-weight-bold">Blood Pressure</label>
    <input type="number" step="any" name="blood_pressure" class="form-control" placeholder="e.g. 72" required>
</div>

<!-- Skin Thickness Input -->
<div class="mb-3">
    <label class="form-label font-weight-bold">Skin Thickness</label>
    <input type="number" step="any" name="skin_thickness" class="form-control" placeholder="e.g. 35" required>
</div>

<!-- Insulin Input -->
<div class="mb-3">
    <label class="form-label font-weight-bold">Insulin Level</label>
    <input type="number" step="any" name="insulin" class="form-control" placeholder="e.g. 0" required>
</div>

<!-- Diabetes Pedigree Function Input -->
<div class="mb-3">
    <label class="form-label font-weight-bold">Diabetes Pedigree Function</label>
    <input type="number" step="0.001" name="dpf" class="form-control" placeholder="e.g. 0.627" required>
</div>
            
            <!-- Glucose Input -->
            <div class="mb-3">
                <label class="form-label font-weight-bold">Glucose Level</label>
                <input type="number" step="any" name="glucose" class="form-control" placeholder="e.g. 120" required>
            </div>

            <!-- BMI Input -->
            <div class="mb-3">
                <label class="form-label">BMI (Body Mass Index)</label>
                <input type="number" step="any" name="bmi" class="form-control" placeholder="e.g. 24.5" required>
            </div>

            <!-- Age Input -->
            <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="number" name="age" class="form-control" placeholder="e.g. 35" required>
            </div>

            <!-- Submit Button -->
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-predict btn-lg">Predict Now</button>
            </div>

        </form>
    </div>
</div>
{% if prediction_text %}
    <div class="alert alert-{{ alert_class }} mt-4 text-center">
        <h4>{{ prediction_text }}</h4>
    </div>
{% endif %}
<!-- Bootstrap JS Link (Optional but good) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>a
