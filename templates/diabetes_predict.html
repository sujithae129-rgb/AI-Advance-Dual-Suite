<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-custom { background-color: #007bff; color: white; border-radius: 8px; padding: 10px 20px; font-weight: bold; width: 100%; }
        .btn-custom:hover { background-color: #0056b3; color: white; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 bg-white">
                    <h2 class="text-center text-primary mb-4">Diabetes Prediction System</h2>
                    <p class="text-center text-muted">Enter your health details below</p>
                    
                    <form action="/predict_diabetes" method="POST">
                        <!-- Glucose Level -->
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Glucose Level 🩸</label>
                            <input type="number" step="any" name="glucose" class="form-control" placeholder="e.g. 120" required>
                        </div>

                        <!-- BMI -->
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">BMI (Body Mass Index) ⚖️</label>
                            <input type="number" step="any" name="bmi" class="form-control" placeholder="e.g. 24.5" required>
                        </div>

                        <!-- Age -->
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Age 🎂</label>
                            <input type="number" step="any" name="age" class="form-control" placeholder="e.g. 35" required>
                        </div>

                        <button type="submit" class="btn btn-custom mt-3">Predict Now</button>
                    </form>

                    {% if prediction_text %}
                    <div class="mt-4 alert alert-info text-center font-weight-bold fs-5">
                        {{ prediction_text }}
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
